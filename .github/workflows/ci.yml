name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carbon_crunch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d carbon_crunch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Lint
        run: ruff check backend tests alembic

      - name: Compile Python
        run: python -m compileall backend tests alembic

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carbon_crunch_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carbon_crunch_test
        run: pytest -q
